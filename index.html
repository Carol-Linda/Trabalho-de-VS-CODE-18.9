<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nosso Site</title>

    <style>
        body {
            background-color: #eaf4ff;
            font-family: "Trebuchet MS", sans-serif;
            text-align: center;
            color: #34506b;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            background-color: white;
            max-width: 650px;
            margin: auto;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(60, 120, 180, 0.2);
        }

        h1 {
            color: #3d8dcc;
            font-family: Georgia, serif;
            font-size: 38px;
            margin-bottom: 15px;
        }

        p {
            font-size: 14px;
            line-height: 1.6;
        }

        .imagem-principal {
            width: 400px;
            max-width: 100%;
            border-radius: 20px;
            margin: 20px 0;
            box-shadow: 0 4px 12px rgba(60, 120, 180, 0.25);
        }

        button {
            background-color: #5b9bd5;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 17px;
            font-family: "Trebuchet MS", sans-serif;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #397bb5;
            transform: scale(1.05);
        }

        h2 {
            color: #3d8dcc;
            margin-top: 35px;
        }

        .integrantes {
            background-color: #eaf4ff;
            padding: 15px;
            border-radius: 20px;
        }

        .integrantes p {
            margin: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Bem-vindo(a) ao nosso site😊</h1>

        <p>Este site foi criado com HTML.</p>

        <img class="imagem-principal" src="imagem.jpg" alt="Imagem do site">

        <br><br>

        <button onclick="window.location.href='imagem2.jpg'">
            Clique aqui
        </button>

        <h2>Integrantes</h2>

        <div class="integrantes">
            <p>Ana Clara P.</p>
            <p>Beatriz G.</p>
            <p>Carolina A.</p>
        </div>

    </div>

</body>
</html>
